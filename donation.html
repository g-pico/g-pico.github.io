        //const serverUrl = 'http://gpico-automation.hopto.org:5000';  // 实际服务器地址

        /**
'''Purpose:
i18n helper for donation alerts using TRANSLATIONS and current language.
Variables:
- key: translation token string
Return:
- localized string or key itself
'''
*/
function t(key){
    try{
        const lang = (typeof getCurrentLanguage==='function')?getCurrentLanguage():(document.documentElement.getAttribute('lang')||'en');
        const dict = (typeof TRANSLATIONS!=='undefined' && TRANSLATIONS[lang])?TRANSLATIONS[lang]:null;
        return (dict && dict[key])?dict[key]:key;
    }catch(e){
        console.error('error:', e);
        return key; // end_of_t
    }
}

async function confirmDonation() {
            if (confirm(t("donation.alert.confirm"))) {
                // Get the donation amount and email address
                const donationAmount = document.getElementById('donationAmount').value;
                const donorEmail = document.getElementById('donorEmail').value;

                // Create a data object to send to the server
                const data = {
                    amount: donationAmount,
                    email: donorEmail
                };

                try {
                    // Send a POST request to the server
                    const response = await fetch(`${serverUrl}/donate`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(data)
                    });

                    // Check if the response is okay
                    if (response.ok) {
                        alert(t('donation.alert.ok'));
                    } else {
                        alert(t('donation.alert.fail'));
                    }
                } catch (error) {
                    console.error('Error:', error);
                    alert(t('donation.alert.error'));
                }
            } else {
                alert(t('donation.alert.cancel'));
            }
        }
    </script>

    <script>
    /*
    '''Purpose:
    QR selection -> switch QR image & description (with HTML links).
    Variables:
    - select#qrSelect: user-chosen payment method
    - img#qrImage: QR image to update
    - p#qrDesc: method-specific HTML description (i18n-driven)
    Acceptable Range:
    - method keys: "paypal","wechat","yoyo","jko","taiwanpay"
    '''
    */

    // Mapping for image file names per method
    const QR_IMAGE_MAP = {
        paypal: "assets/payment/paypal.png",
        wechat: "assets/payment/wechat_pay.png",
        yoyo: "assets/payment/yoyo_pay.png",
        jko: "assets/payment/j-ko_pay.png",
        taiwanpay: "assets/payment/taiwan_pay.png",
    };

    // Mapping for description i18n keys (HTML-capable strings)
    const QR_DESC_KEY_MAP = {
        paypal: "donation.p3.paypal_html",
        wechat: "donation.p3.wechat_html",
        yoyo: "donation.p3.yoyo_html",
        jko: "donation.p3.jko_html",
        taiwanpay: "donation.p3.taiwanpay_html",
    };

    /** Get current selected method key */
    function getSelectedMethod() {
        try {
            const sel = document.getElementById("qrSelect");
            return (sel && sel.value) ? sel.value : "paypal";
        } catch (e) {
            console.error(`getSelectedMethod error: ${e}`);
            return "paypal"; // end_of_getSelectedMethod
        }
    }

    /** Update QR image according to selected method */
    function updateQRImage(method) {
        try {
            const img = document.getElementById("qrImage");
            const src = QR_IMAGE_MAP[method] || QR_IMAGE_MAP["paypal"];
            if (img) img.src = src;
        } catch (e) {
            console.error(`updateQRImage error: ${e}`);
            // pass  // end_of_updateQRImage
        }
    }

    /** Update method-specific description (allow HTML) */
    function refreshQRDesc(method) {
        try {
            const descEl = document.getElementById("qrDesc");
            const key = QR_DESC_KEY_MAP[method] || QR_DESC_KEY_MAP["paypal"];
            // Use t(key) from donation.html (already defined above & in i18n.js)
            const html = (typeof t === "function") ? t(key) : key;
            if (descEl) descEl.innerHTML = html;
        } catch (e) {
            console.error(`refreshQRDesc error: ${e}`);
            // pass  // end_of_refreshQRDesc
        }
    }

    /** On selection change handler */
    function onQRChange() {
        try {
            const method = getSelectedMethod();
            updateQRImage(method);
            refreshQRDesc(method);
        } catch (e) {
            console.error(`onQRChange error: ${e}`);
            // pass  // end_of_onQRChange
        }
    }

    /** Initialize bindings and initial render */
    function initQR() {
        try {
            const sel = document.getElementById("qrSelect");
            if (sel) {
                sel.addEventListener("change", onQRChange);
            }
            // Initial render
            onQRChange();

            // Re-apply desc on language changes (custom event from i18n.js)
            document.addEventListener("i18n:applied", function () {
                try {
                    refreshQRDesc(getSelectedMethod());
                } catch (e) {
                    console.error(`i18n:applied handler error: ${e}`);
                    // pass
                }
            });
        } catch (e) {
            console.error(`initQR error: ${e}`);
            // pass  // end_of_initQR
        }
    }

    // DOM ready hook
    document.addEventListener("DOMContentLoaded", function () {
        try {
            initQR();
        } catch (e) {
            console.error(`DOMContentLoaded initQR error: ${e}`);
            // pass
        }
    }); // end_of_DOMContentLoaded

    /* ---- Optional tiny "test object" for manual checks (won't run automatically) ---- */
    const DonationQRE2E = {
        /*
        '''Purpose:
        Simple manual tests for QR logic. Call DonationQRE2E.run() in console.
        '''
        */
        run: function () {
            try {
                const methods = Object.keys(QR_IMAGE_MAP);
                methods.forEach((m) => {
                    document.getElementById("qrSelect").value = m;
                    onQRChange();
                    console.log(`[E2E] switched to: ${m}, img.src=`, document.getElementById("qrImage").src);
                });
                return true;
            } catch (e) {
                console.error(`DonationQRE2E error: ${e}`);
                return false;
            } // end_of_run
        }
    }; // end_of_DonationQRE2E
    </script>
