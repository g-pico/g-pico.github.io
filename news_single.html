<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News of g-Pico</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <script src="news.js"></script> <!-- 引用新聞詳細信息文件 -->
    <style>
        .image-container img {
            max-width: 80%;
            height: auto;
        }
    </style>
    <script>
    /*
    '''Purpose:
    Render a single news article by URL param ?news={id}, with i18n-ready fields.
    Variables:
    - newsId: string from URLSearchParams ("1", "2", ...)
    - tField: i18n-safe field accessor (object or string)
    Acceptable Range:
    - newsId must match a key "news{N}" in news.js
    '''
    */
    function initializeNews(refresh=false) {
    try {
        const urlParams = new URLSearchParams(window.location.search);
        const newsId = urlParams.get('news');
        const key = `news${newsId}`;
        const newsItem = (typeof news === 'object') ? news[key] : null;

        if (!newsItem) {
        document.getElementById('newsTitle').textContent = "News not found.";
        return; // end_of_initializeNews
        }

        // i18n-safe field access
        const _lang = (typeof getCurrentLanguage==='function')
                        ? getCurrentLanguage()
                        : (document.documentElement.getAttribute('lang')||'en');
        const _t = (v)=>{ try{ return (typeof tField === 'function') ? tField(v) : ( (v&&typeof v==='object')? (v[_lang]||v['en']||Object.values(v)[0]) : v ); }catch(e){ console.error('local tField error:', e); return v;} };

        // Title / Subtitle / Content / Image
        document.title = _t(newsItem.title);
        document.getElementById('newsTitle').textContent = _t(newsItem.title);

        const imgEl = document.getElementById('newsImage');
        if (imgEl) imgEl.src = newsItem.image || '';

        const subEl = document.getElementById('newsSubtitle');
        if (subEl){
        subEl.textContent = _t(newsItem.subtitle);
        subEl.style.color = newsItem.subtitleColor || '#007bff';
        }

        const contentEl = document.getElementById('newsContent');
        if (contentEl) contentEl.innerHTML = _t(newsItem.content);

    } catch (e) {
        console.error(`initializeNews error: ${e}`); // end_of_initializeNews
    }
    } // end_of_initializeNews

    /*
    '''Purpose:
    Re-render when i18n translations are applied (language changed).
    '''
    */
    try{
    if(!window.__boundNewsI18N){
        document.addEventListener("i18n:applied", function(ev){
        try{
            initializeNews(true);
        }catch(e){
            console.error(`news i18n:applied handler error: ${e}`); // end_of_news_i18n_handler
        }
        });
        window.__boundNewsI18N = true; // end_of_bind_once
    }
    }catch(e){
    console.error(`bind news i18n handler error: ${e}`); // end_of_bind_news_i18n_handler
    }

    /*
    '''Purpose:
    Page onload: first render article, then applyTranslations for nav & static labels.
    '''
    */
    window.onload = function(){
    try{
        initializeNews();
        if (typeof applyTranslations === 'function'){ applyTranslations(document); }
    }catch(e){
        console.error('init error:', e); // end_of_window_onload
    }
    };
    </script>

    <script src="i18n.js"></script>
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    
</head>

<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <a class="navbar-brand" href="index.html" data-i18n="nav.brand">g-Pico Automation home</a>

        <!-- NEW: 漢堡鍵 -->
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ml-auto">
                <li class="nav-item"><a class="nav-link" href="index.html" data-i18n="nav.home">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="products.html" data-i18n="nav.products">Products</a></li>
                <li class="nav-item"><a class="nav-link" href="contact.html" data-i18n="nav.contact">Contact</a></li>
                <li class="nav-item"><a class="nav-link" href="donation.html" data-i18n="nav.donation">Donation</a></li>
            </ul>
            <select id="langSelect" class="custom-select ml-2" style="width:auto;">
                <option value="en">English</option>
                <option value="zh-TW">繁體中文</option>
                <option value="zh-CN">简体中文</option>
            </select>
        </div>
    </nav>

    <div class="container mt-5">
        <h1 id="newsTitle"></h1> <!-- 動態設定新聞標題 -->
        <div class="image-container text-center">
            <img id="newsImage" src="" alt="News Image"> <!-- 動態設定新聞圖片 -->
        </div>
        <h2 id="newsSubtitle" class="mt-4"></h2> <!-- 動態設定新聞副標題 -->
        <div id="newsContent" class="mt-3"></div> <!-- 動態設定新聞內容 -->
    </div>

    <!-- Footer -->
    <footer class="bg-light text-center text-lg-start mt-5">
        <div class="container p-4">
            <p>&copy; 2024 g-Pico</p>
        </div>
    </footer>
</body>

</html>
