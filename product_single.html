<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>g-Pico Product Details</title> <!-- 頁面標題會在 JavaScript 中動態設置 -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <script src="products.js"></script> <!-- 引用產品詳細信息文件 -->
    <style>
        .thumbnails img {
            cursor: pointer;
            max-width: 100px;
            margin: 5px;
            border: 1px solid #ddd;
        }

        .thumbnails img:hover {
            border: 1px solid #777;
        }

        .description-short {
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 5;
            -webkit-box-orient: vertical;
            /* Add standard property for better tooling compatibility */
            line-clamp: 5; /* not widely supported yet, safe as a hint */
        }

        .show-more {
            cursor: pointer;
            color: blue;
        }

        .description img {
            max-width: 50%;
            height: auto;
        }
    </style>
    <script>
        /*
        '''Purpose:
        Initialize single product page without price/buy/note (commented out).
        Variables:
        - URL ?product={id}: used to pick products["product{id}"]
        - tField: language-aware field getter
        Acceptable Range:
        - id must map to products.js key
        '''
        */
        function showImage(src) {
            try {
                document.getElementById('mainImage').src = src;
                return true;
            } catch (e) {
                console.error(`showImage error: ${e}`);
                return false; // end_of_showImage
            }
        }

        function initializeProduct(refresh=false) {
            try {
                const urlParams = new URLSearchParams(window.location.search);
                const productId = urlParams.get('product');
                const productDetails = products[`product${productId}`];

                const _lang = (typeof getCurrentLanguage==='function')
                                ? getCurrentLanguage()
                                : (document.documentElement.getAttribute('lang')||'en');
                const tField = (val)=>{
                try{
                    if(val && typeof val==='object'){ return val[_lang] || val['en'] || Object.values(val)[0]; }
                    return val;
                }catch(e){ console.error('tField error:', e); return val; }
                };

                if (!productDetails) return;

                // title & name
                document.title = tField(productDetails.name);
                const nameEl = document.getElementById('productName');
                if (nameEl) nameEl.textContent = tField(productDetails.name);

                // description（先寫入，再加 clamp class）
                const descEl = document.getElementById('productDescription');
                if (descEl) {
                descEl.innerHTML = tField(productDetails.description);
                if (!descEl.classList.contains('description-short')) {
                    descEl.classList.add('description-short');
                }
                }

                // thumbnails：refresh 時先清空再生成
                const mainImage = document.getElementById('mainImage');
                const thumbnails = document.getElementById('thumbnails');
                if (thumbnails) thumbnails.innerHTML = '';
                if (Array.isArray(productDetails.images) && productDetails.images.length > 0) {
                if (mainImage) mainImage.src = productDetails.images[0];
                if (thumbnails) {
                    productDetails.images.forEach((src, idx) => {
                    const img = document.createElement('img');
                    img.src = src;
                    img.alt = 'Product Image ' + (idx + 1);
                    img.onclick = () => showImage(src);
                    thumbnails.appendChild(img);
                    });
                }
                }

                // ShowMore 顯示與切換（綁一次即可；若已綁，這裡只更新文字）
                const showMore = document.getElementById('showMore');
                if (descEl && showMore) {
                setTimeout(()=>{
                    try{
                    if (descEl.scrollHeight > descEl.clientHeight) {
                        showMore.style.display = 'inline';
                    } else {
                        showMore.style.display = 'none';
                    }
                    }catch(e){ console.error(`measure desc error: ${e}`); }
                }, 0);

                if (!showMore._bound) {
                    showMore.onclick = () => {
                    try{
                        if (descEl.classList.contains('description-short')) {
                        descEl.classList.remove('description-short');
                        showMore.textContent = 'Show Less';
                        } else {
                        descEl.classList.add('description-short');
                        showMore.textContent = 'Show More';
                        }
                    }catch(e){ console.error(`showMore toggle error: ${e}`); /* pass */ }
                    };
                    showMore._bound = true; // 防止重複綁定
                }
                }

                // price/buy/note 仍維持隱藏（HTML 已註解；JS 不賦值）
            } catch (e) {
                console.error(`initializeProduct error: ${e}`); // end_of_initializeProduct
            }
            }

        
        /*
        '''Purpose:
        Re-render single product page when i18n translations are applied.
        '''
        */
        try {
        document.addEventListener("i18n:applied", function (ev) {
            try {
            initializeProduct(true); // 傳 true 表示 refresh 模式（可選）
            } catch (e) {
            console.error(`single i18n:applied handler error: ${e}`); // end_of_single_i18n_applied
            }
        });
        } catch (e) {
        console.error(`bind single i18n handler error: ${e}`); // end_of_bind_single_i18n_handler
        }    

        window.onload = function(){
            try {
                initializeProduct();
                if (typeof applyTranslations === 'function'){ applyTranslations(document); }
            } catch(e) {
                console.error('init error:', e); // end_of_window_onload
            }
        };
        </script>

    <script src="i18n.js"></script>
</head>

<body>

    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <a class="navbar-brand" href="index.html" data-i18n="nav.brand">g-Pico Automation home</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ml-auto">
                <li class="nav-item"><a class="nav-link" href="index.html" data-i18n="nav.home">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="products.html" data-i18n="nav.products">Products</a></li>
                <li class="nav-item"><a class="nav-link" href="contact.html" data-i18n="nav.contact">Contact</a></li>
                <li class="nav-item"><a class="nav-link" href="donation.html" data-i18n="nav.donation">Donation</a></li>
            </ul>
            <select id="langSelect" class="custom-select ml-2" style="width:auto;">
                <option value="en">English</option>
                <option value="zh-TW">繁體中文</option>
                <option value="zh-CN">简体中文</option>
            </select>
        </div>
    </nav>

    <div class="container mt-5">
        <h1 id="productName"></h1> <!-- 顯示產品名稱 -->
        <div class="row">
            <div class="col-md-8">
                <!-- 主產品圖片 -->
                <img id="mainImage" src="" class="d-block w-100" alt="Product Image">
                <!-- 顯示所有產品圖片的縮略圖 -->
                <div id="thumbnails" class="thumbnails text-center mt-3"></div>
            </div>
        </div>
        <div class="mt-3">
            <!-- 產品詳情和購買連結 -->
            <h5 class="card-title" id="productName_sub"></h5>
            <p class="card-text description-short description" id="productDescription"></p>
            <a id="showMore" class="show-more">Show More</a>


            <!--
            <p class="card-text">
                <strong><span data-i18n="products.price">Price:</span></strong> <span id="productPrice"></span></p>
            <a id="buyNowLink" class="btn btn-primary"><span data-i18n="products.buy_now">Buy Now</span></a> -->  <!-- 動態設置購買按鈕連結 -->
            
            <!--
            <div class="mt-3">
                <h5>Note:</h5>
                <p id="productNote"></p>
            </div>
            -->

            
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-light text-center text-lg-start mt-5">
        <div class="container p-4">
            <p>&copy; 2024 g-Pico</p>
        </div>
    </footer>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>

</html>
